name: Build Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'

      - name: Instalar Flet CLI
        run: |
          pip install flet

      - name: Compilar APK do Android
        run: |
          flet build apk

      - name: Disponibilizar o APK para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Vida-do-Cuei-Android
          path: build/apk/*.apk
